# CiteExtract Configuration
#
# Application behavior only. No secrets here.
# API keys and emails go in .env (copy .env.example to .env).

grobid:
  service_url: "http://localhost:8070"
  timeout: 120
  concurrency: 4                    # HTTP connection pool size to GROBID (L1 parser)
  # Cap on concurrent full-text PDF extractions during the agentic
  # pre-retrieve stage. The GROBID image ships with an internal pool of
  # ~10 threads; staying under that avoids queue buildup and timeouts.
  # Tune down if you see GROBID 5xx in logs, up if you have a beefier box.
  extract_concurrency: 8
  health_check_timeout: 5           # seconds to wait for /api/isalive
  docker_image: "grobid/grobid:0.8.2-crf"
  retry:
    max_attempts: 3
    multiplier: 3
    min_wait: 5
    max_wait: 30

parsing:
  context_sentences_before: 2       # literature shows claims often precede the citation
  context_sentences_after: 1
  sentence_splitter: "spacy"        # "spacy" or "simple"

apis:
  crossref:
    timeout: 15
  openalex:
    timeout: 20
    results_per_page: 5
  semantic_scholar:
    timeout: 20
    results_per_page: 5
  pubmed:
    timeout: 15
    results_per_page: 5
  openreview:
    timeout: 15

rate_limits:
  crossref: [40, 1]                 # [max_rate, time_period_seconds]
  # S2 free-tier (even with API key) is 1 req/s shared across endpoints.
  # Going higher triggers 429 + exponential backoff, which is slower than
  # honoring the limit. Only raise this if you've been approved for a
  # higher-throughput key by emailing api@semanticscholar.org.
  semantic_scholar: [1, 1]
  openalex: [9, 1]
  pubmed: [2, 1]
  unpaywall: [10, 1]                # 100K/day, ~10/s is polite
  arxiv: [1, 3]                     # arXiv asks for <=1 req per 3 seconds
  openreview: [3, 1]                # polite default; OpenReview has no published cap

thresholds:
  title_match: 0.80
  author_match: 0.80                # surname-Jaccard floor for MATCH; <0.80 routes to NEEDS_METADATA for the agent to investigate
  venue_match: 0.60
  subtitle_ratio: 0.40              # colon-split threshold in title normalization
  composite_match: 0.65             # 0.5*title + 0.3*author + 0.2*year floor for picking a DB candidate; below this the cascade falls back to title-only match

# Experimental L2 fallback databases. Each one fires only when the main
# scholarly cascade (CrossRef → S2 → OpenAlex → CrossRef-by-title → PubMed
# → arXiv) has missed. Toggle to ``false`` to A/B against the legacy
# behaviour.
experimental_fallbacks:
  openreview: true                  # Catches OpenReview-only tech reports
                                    # (LeCun's "Path Towards Autonomous
                                    # Machine Intelligence", etc.)

risk_levels:
  low: 0.90                         # integrity > this = LOW risk
  medium: 0.70                      # integrity > this = MEDIUM risk
  high: 0.50                        # integrity > this = HIGH risk
                                    # below high = CRITICAL

cache:
  db_path: "data/cache/api_cache.db"
  ttl_metadata: 2592000             # 30 days in seconds
  ttl_abstract: 2592000             # 30 days
  ttl_retraction: 604800            # 7 days
  ttl_not_found: 604800             # 7 days
  ttl_fulltext: 604800              # 7 days (PDFs don't change)

# Comprehension support (passage retrieval from cited papers)
comprehension:
  top_k: 3                          # number of passages to retrieve
  # Dense retrieval settings (Phase B)
  dense_model: "all-MiniLM-L6-v2"  # null to disable dense, use BM25 only
  bm25_candidates: 10               # BM25 candidates for RRF
  dense_candidates: 10              # dense candidates for RRF
  rrf_k: 60                         # RRF constant (standard value)
  # Cross-encoder reranks the top-N RRF candidates. Lower = faster
  # (fewer forward passes) but can miss passages BM25/dense underranked.
  # 10 is enough in practice — RRF over BM25(10) + dense(10) already
  # converges on a strong candidate set; the marginal value of reranking
  # positions 11–15 is small. Bump to 15 if eval shows otherwise.
  rerank_pool: 10
  # Per-ref hard cap for full-text fetch (waterfall: oa_url → unpaywall
  # → arxiv → s2 fallback → arxiv-by-title → abstract). On a paper with
  # weak OA coverage the waterfall can spend 20-40s per ref before
  # falling through to abstract_only.
  #
  # Empirically (paper1, 57 FOUND refs): with cap=10, 19 refs (33%) timed
  # out and 12 (21%) succeeded barely-under-cap (5-10s). Variance pushes
  # the just-under group over. 30s gives those a comfortable margin while
  # still bounding worst-case wall time at ~30s/ref. Set higher to favor
  # recall over latency, lower if you see fetches dominating wall clock.
  per_ref_fetch_timeout_s: 30

# Agentic verification mode (rule-based triage + focused agents for ambiguous cases)
agentic:
  model: "gpt-5-mini"
  temperature: 0.0
  max_concurrent_agents: 15
  timeout: 60
  metadata_agent:
    # Tool-calling cap. Each round = one LLM call + one tool result.
    # In practice the agent converges in 2 rounds for well-defined cases
    # (DOI lookup, author/title verification); 3 rounds covers the rare
    # composite-evidence cases (DOI mismatch + author check + venue
    # confirmation). Raised from 3 → 5 once added marginal accuracy on a
    # few hard cases at +30s/ref; brought back to 3 for production
    # latency. Bump if eval shows recall regressions on flagged refs.
    max_tool_rounds: 3
    max_tokens: 2048
  claim_agent:
    # 0 = skip the tool-calling phase entirely. Passages are already
    # pre-retrieved and handed to the agent in the user message, so extra
    # tool rounds cost an LLM call each without producing new evidence.
    # Raise to 1+ only if you've seen the agent need more passages than
    # pre_retrieve provided.
    max_tool_rounds: 0
    max_tokens: 2048
    verdict_classes: 3              # 2 (SUPPORTED/NOT_SUPPORTED) or 3 (SUPPORTS/CONTRADICTS/NEUTRAL)
    # System prompt variant. ``v3`` was selected via the gold-set A/B in
    # data/output/_ab_results.json: 88.5% recall vs 26.9% baseline at
    # 95.8% precision. See claim_3class_v3.txt for the framing rationale.
    prompt_variant: "v3"
  triage:
    min_databases_for_fabricated: 2

# Claim verification (Standard mode: passage retrieval + LLM analysis)
claim_verification:
  model: "gpt-5-mini"
  temperature: 0.0
  max_tokens: 1024
  timeout: 60

# LLM pricing (for cost tracking)
llm:
  # Hard cap on LLM spend per paper for the GROBID-fallback ref parser.
  # Typical papers run ~$0.02; this guards against runaways from misconfigured
  # models or pathological 500-reference review articles. Raise only if you've
  # measured a legitimate workload exceeding it.
  max_cost_per_paper: 0.50          # USD
  pricing:
    input_cost_per_million: 0.15    # USD per 1M input tokens
    output_cost_per_million: 0.60   # USD per 1M output tokens
