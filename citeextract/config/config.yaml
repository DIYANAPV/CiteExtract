grobid:
  service_url: "http://localhost:8070"
  timeout: 120
  concurrency: 4
  extract_concurrency: 8
  health_check_timeout: 5
  docker_image: "grobid/grobid:0.8.2-crf"
  retry:
    max_attempts: 3
    multiplier: 3
    min_wait: 5
    max_wait: 30

parsing:
  context_sentences_before: 2
  context_sentences_after: 1
  sentence_splitter: "spacy"        # "spacy" or "simple"

apis:
  crossref:
    timeout: 15
  openalex:
    timeout: 20
    results_per_page: 5
  semantic_scholar:
    timeout: 20
    results_per_page: 5
  pubmed:
    timeout: 15
    results_per_page: 5
  openreview:
    timeout: 15

rate_limits:                         # [max_rate, time_period_seconds]
  crossref: [40, 1]
  semantic_scholar: [1, 1]
  openalex: [9, 1]
  pubmed: [2, 1]
  unpaywall: [10, 1]
  arxiv: [1, 3]
  openreview: [3, 1]

thresholds:
  title_match: 0.80
  author_match: 0.80
  venue_match: 0.60
  subtitle_ratio: 0.40
  composite_match: 0.65

experimental_fallbacks:
  openreview: true

risk_levels:
  low: 0.90
  medium: 0.70
  high: 0.50

cache:
  db_path: "data/cache/api_cache.db"
  ttl_metadata: 2592000             # 30 days
  ttl_abstract: 2592000
  ttl_retraction: 604800            # 7 days
  ttl_not_found: 604800
  ttl_fulltext: 604800

comprehension:
  top_k: 3
  dense_model: "all-MiniLM-L6-v2"   # null to disable
  bm25_candidates: 10
  dense_candidates: 10
  rrf_k: 60
  rerank_pool: 10
  per_ref_fetch_timeout_s: 30

agentic:
  model: "gpt-5-mini"
  temperature: 0.0
  max_concurrent_agents: 15
  timeout: 60
  metadata_agent:
    max_tool_rounds: 3
    max_tokens: 2048
  claim_agent:
    max_tool_rounds: 0              # 0 = skip tool calls
    max_tokens: 2048
    verdict_classes: 3              # 2 or 3
    prompt_variant: "v3"
  triage:
    min_databases_for_fabricated: 2

claim_verification:
  model: "gpt-5-mini"
  temperature: 0.0
  max_tokens: 1024
  timeout: 60

llm:
  max_cost_per_paper: 0.50          # USD
  pricing:
    input_cost_per_million: 0.15
    output_cost_per_million: 0.60
